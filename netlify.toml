[build.environment]
  NODE_VERSION = "20.19.0"

# Bike network vector tiles (posts/nyc_directed_network.html): tiles with no streets (water, outside NYC) aren't written to
# disk, so answer those requests with an empty tile instead of a 404. Existing tiles are served as-is (rule isn't forced).
[[redirects]]
  from = "/src/tiles/nyc_network/*"
  to = "/src/tiles/empty.pbf"
  status = 200
